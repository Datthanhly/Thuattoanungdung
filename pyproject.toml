[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phenikaa-a4-evacuation"
version = "2.1.0"
requires-python = ">=3.11"
description = "Reproducible evacuation optimization for the user-provided A4 floor plan"
dependencies = ["Pillow>=10,<13", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "networkx>=3.4,<4"]

[project.scripts]
a4-evac = "a4_evac.cli:main"

[tool.setuptools.packages.find]
include = ["a4_evac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
